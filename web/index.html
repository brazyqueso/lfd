<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LFD web chat</title>
<style>
  :root { --bg:#070707; --term:#0c0c0c; --panel:#121212; --fg:#f2f2f2; --muted:#8b8b8b; --red:#c41e3a; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 15px/1.55 "IBM Plex Sans", "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; min-height:100%; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--red); background:var(--term); }
  pre.logo { margin:0; color:var(--red); font: 10px/1.15 ui-monospace,monospace; }
  header h1 { margin:0; font-size:13px; letter-spacing:.18em; color:var(--red); }
  header p { margin:2px 0 0; font-size:11px; color:var(--muted); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--red); padding:8px 10px; min-height:44px; }
  main { flex:1; display:flex; flex-direction:column; max-width:820px; width:100%; margin:0 auto; padding:16px; min-height:0; }
  #log { flex:1; overflow:auto; display:flex; flex-direction:column; gap:14px; padding-right:4px; }
  .msg { padding:12px 14px; max-width:92%; }
  .msg.user { align-self:flex-end; border:1px solid var(--red); background:var(--panel); }
  .msg.ai { align-self:flex-start; background:var(--term); border-left:3px solid var(--red); }
  .msg b { display:block; font-size:10px; letter-spacing:.16em; color:var(--red); margin-bottom:6px; }
  .msg pre { margin:0; white-space:pre-wrap; word-break:break-word; font: 14.5px/1.55 inherit; }
  form { display:flex; gap:8px; margin-top:12px; border:1px solid var(--red); background:var(--panel); padding:8px; }
  textarea { flex:1; resize:none; min-height:52px; background:transparent; color:var(--fg); border:0; outline:0; font: inherit; padding:8px; }
  button { background:var(--red); color:#0a0a0a; border:0; font-weight:700; letter-spacing:.14em; padding:0 18px; min-height:52px; cursor:pointer; }
  button:disabled { opacity:.4; }
  footer { padding:8px 16px; border-top:1px solid var(--red); font-size:11px; color:var(--muted); }
  footer a { color:var(--red); text-decoration:none; margin-right:14px; }
  .err { color:var(--red); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <pre class="logo"> _     _____ ____
| |   |  ___|  _ \
| |   | |_  | | | |
| |___|  _| | |_| |
|_____|_|   |____/</pre>
  <div>
    <h1>LFD WEB CHAT</h1>
    <p>local Ollama · by Pakun</p>
  </div>
  <select id="model" aria-label="model"></select>
</header>
<main>
  <div id="log"></div>
  <form id="f">
    <textarea id="t" placeholder="Write like a normal chat. Shift+Enter for newline." rows="2"></textarea>
    <button id="go" type="submit">SEND</button>
  </form>
  <div class="err" id="err"></div>
</main>
<footer>
  <a href="https://github.com/brazyqueso">github.com/brazyqueso</a>
  <a href="https://github.com/brazyqueso/lfd">lfd repo</a>
  connected to ollama :11434
</footer>
<script>
const log = document.getElementById("log");
const err = document.getElementById("err");
const model = document.getElementById("model");
const t = document.getElementById("t");
const go = document.getElementById("go");
const msgs = [];

function add(role, text) {
  const el = document.createElement("article");
  el.className = "msg " + (role === "user" ? "user" : "ai");
  el.innerHTML = "<b>" + (role === "user" ? "YOU" : "LFD") + "</b><pre></pre>";
  el.querySelector("pre").textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el.querySelector("pre");
}

async function loadModels() {
  try {
    const r = await fetch("/ollama/api/tags");
    const j = await r.json();
    const names = (j.models || []).map(m => m.name);
    model.innerHTML = "";
    if (!names.length) {
      model.innerHTML = "<option>no models — pull one in LFD</option>";
      return;
    }
    names.forEach(n => {
      const o = document.createElement("option");
      o.value = n; o.textContent = n;
      model.appendChild(o);
    });
  } catch (e) {
    err.textContent = "Ollama is not up. In LFD: start daemon, pull a model.";
  }
}

add("assistant", "Web chat for your local model. Same box as the terminal — just easier to read.");

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const text = t.value.trim();
  if (!text || go.disabled) return;
  t.value = "";
  err.textContent = "";
  add("user", text);
  msgs.push({ role: "user", content: text });
  const pre = add("assistant", "");
  go.disabled = true;
  try {
    const r = await fetch("/ollama/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: model.value, messages: msgs, stream: false })
    });
    const j = await r.json();
    const out = (j.message && j.message.content) || j.error || "empty";
    pre.textContent = out;
    msgs.push({ role: "assistant", content: out });
  } catch (ex) {
    pre.textContent = "failed: " + ex;
    err.textContent = String(ex);
  } finally {
    go.disabled = false;
    log.scrollTop = log.scrollHeight;
    t.focus();
  }
};

t.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); }
});

loadModels();
</script>
</body>
</html>
